<!DOCTYPE html>
<html>
<head>
    <title>IoT Compression Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🚀 Smart IoT Dashboard</h1>
    <p class="subtitle">AI-powered sensor data compression</p>

    <div class="input-box">
        <input id="inputData" placeholder="Enter data (10,20,30)">
        <button onclick="compressData()">Compress</button>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="card">
            <h3>Original Avg</h3>
            <p id="originalAvg">--</p>
        </div>

        <div class="card">
            <h3>Compressed Avg</h3>
            <p id="compressedAvg">--</p>
        </div>
    </div>

    <!-- GRAPH CARD -->
    <div class="chart-card">
        <h3>📊 Compression Visualization</h3>
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
let chart;

function compressData() {
    let input = document.getElementById("inputData").value;

    if (!input) return alert("Enter data");

    let values = input.split(",").map(Number);
    let compressed = values.map(v => v * 0.5);

    let avgOriginal = values.reduce((a,b)=>a+b,0)/values.length;
    let avgCompressed = compressed.reduce((a,b)=>a+b,0)/compressed.length;

    document.getElementById("originalAvg").innerText = avgOriginal.toFixed(2);
    document.getElementById("compressedAvg").innerText = avgCompressed.toFixed(2);

    drawChart(values, compressed);
}

function drawChart(original, compressed) {
    const ctx = document.getElementById('chart');

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: original.map((_, i) => i+1),
            datasets: [
                {
                    label: 'Original',
                    data: original,
                    borderColor: '#00c6ff',
                    tension: 0.4
                },
                {
                    label: 'Compressed',
                    data: compressed,
                    borderColor: '#ff4d6d',
                    tension: 0.4
                }
            ]
        }
    });
}
</script>

</body>
</html>
