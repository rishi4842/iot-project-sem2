<!DOCTYPE html>
<html>
<head>
    <title>IoT Compression Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🚀 Smart IoT Dashboard</h1>
    <p class="subtitle">AI-powered sensor data compression</p>

    <div class="input-box">
        <input id="input" placeholder="Enter values (10,20,30)">
        <button onclick="compressData()">Compress</button>
    </div>

    <div class="stats">
        <div class="card">
            <h3>Original Avg</h3>
            <p id="avgOriginal">-</p>
        </div>
        <div class="card">
            <h3>Compressed Avg</h3>
            <p id="avgCompressed">-</p>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
let chart;

function compressData() {
    let input = document.getElementById("input").value;

    if (!input) return alert("Enter data");

    let values = input.split(",").map(Number);
    let compressed = values.map(v => v * 0.5);

    document.getElementById("avgOriginal").innerText =
        (values.reduce((a,b)=>a+b)/values.length).toFixed(2);

    document.getElementById("avgCompressed").innerText =
        (compressed.reduce((a,b)=>a+b)/compressed.length).toFixed(2);

    drawChart(values, compressed);
}

function drawChart(original, compressed) {
    const ctx = document.getElementById('chart');

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: original.map((_, i) => i+1),
            datasets: [
                {
                    label: 'Original',
                    data: original,
                    borderColor: '#00c6ff',
                    tension: 0.4
                },
                {
                    label: 'Compressed',
                    data: compressed,
                    borderColor: '#ff4d6d',
                    tension: 0.4
                }
            ]
        }
    });
}
</script>

</body>
</html>
