<!DOCTYPE html>
<html>
<head>
    <title>Smart IoT Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>🚀 Smart IoT Dashboard</h1>
    <p class="subtitle">AI-powered sensor data compression</p>

    <div class="input-box">
        <input id="inputData" placeholder="10,20,30">
        <button onclick="compressData()">Compress</button>
    </div>

    <p id="emptyMsg">Enter data and click compress to see results</p>

    <div class="dashboard">

        <div class="stats">
            <div class="card">
                <h3>Original Avg</h3>
                <p id="originalAvg">--</p>
            </div>

            <div class="card">
                <h3>Compressed Avg</h3>
                <p id="compressedAvg">--</p>
            </div>

            <div class="card">
                <h3>Compression %</h3>
                <p id="compressionRate">--</p>
            </div>
        </div>

        <div class="chart-card">
            <h2 class="section-title">📊 Results</h2>
            <canvas id="chart"></canvas>
        </div>

    </div>

</div>

<script>

let chart;

function compressData() {

    let input = document.getElementById("inputData").value.trim();

    if (!input) {
        alert("Enter valid data");
        return;
    }

    let values = input.split(',')
        .map(v => Number(v.trim()))
        .filter(v => !isNaN(v));

    if (values.length === 0) {
        alert("Enter valid numeric data");
        return;
    }

    let compressed = values.map(v => v * 0.5);

    let avgOriginal = values.reduce((a,b)=>a+b,0)/values.length;
    let avgCompressed = compressed.reduce((a,b)=>a+b,0)/compressed.length;
    let compressionRate = ((1 - (compressed.reduce((a,b)=>a+b,0) / values.reduce((a,b)=>a+b,0))) * 100);

    document.getElementById("originalAvg").innerText = avgOriginal.toFixed(2);
    document.getElementById("compressedAvg").innerText = avgCompressed.toFixed(2);
    document.getElementById("compressionRate").innerText = compressionRate.toFixed(1) + "%";
    document.getElementById("emptyMsg").style.display = "none";

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: 'line',
        data: {
            labels: values.map((_, i) => i+1),
            datasets: [
                {
                    label: "Original",
                    data: values,
                    borderColor: "#22c55e"
                },
                {
                    label: "Compressed",
                    data: compressed,
                    borderColor: "#ef4444"
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        color: "white"
                    }
                }
            },
            scales: {
                x: {
                    ticks: { color: "white" }
                },
                y: {
                    ticks: { color: "white" }
                }
            }
        }
    });

}

</script>

</body>
</html>
