<!DOCTYPE html>
<html>
<head>
    <title>Smart IoT Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚀 Smart IoT Compression Dashboard</h1>

<div class="card">
    <input id="input" placeholder="Enter sensor data (e.g. 10,20,30)">
    <button onclick="compressData()">Compress</button>
</div>

<div class="card">
    <h3>📊 Results</h3>
    <p id="result">No data yet</p>
</div>

<div class="card">
    <canvas id="chart"></canvas>
</div>

<script>
let chart;

function compressData() {
    let input = document.getElementById("input").value;

    if (!input) {
        alert("Enter data first");
        return;
    }

    let values = input.split(",").map(Number);

    // Fake ML compression
    let compressed = values.map(v => (v * 0.5).toFixed(2));

    document.getElementById("result").innerText =
        "Compressed: " + compressed.join(", ");

    drawChart(values, compressed);
}

function drawChart(original, compressed) {
    const ctx = document.getElementById('chart');

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: original.map((_, i) => "Data " + (i+1)),
            datasets: [
                {
                    label: 'Original',
                    data: original,
                    borderWidth: 2
                },
                {
                    label: 'Compressed',
                    data: compressed,
                    borderWidth: 2
                }
            ]
        }
    });
}
</script>

</body>
</html>
