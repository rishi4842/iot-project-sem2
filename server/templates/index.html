<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Compression Demo</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>IoT Compression Demo</h1>
        <p>Enter comma-separated values and click Compress.</p>

        <input id="input" type="text" placeholder="Enter sensor data (e.g. 30,45,60)">
        <button onclick="compressData()">Compress</button>

        <p id="result"></p>
    </div>

    <script>
        function compressData() {
            const input = document.getElementById("input").value;

            if (!input) {
                alert("Enter some data");
                return;
            }

            // Fake compression logic (for demo)
            const values = input.split(",").map(Number);
            const compressed = values.map(v => (v * 0.5).toFixed(2));

            document.getElementById("result").innerText =
                "Compressed Data: " + compressed.join(", ");
        }
    </script>
</body>
</html>
